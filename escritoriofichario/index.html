<title>Acesso restrito</title>
<style>
  :root { --bg:#fbfaf7; --texto:#22201c; --suave:#6b665c; --linha:#e2ddd2; --acento:#7a4b1e; }

  input[type=password] { padding:11px 12px; border:1px solid var(--linha); border-radius:8px; background:transparent; color:inherit; font:inherit; }

  button:disabled { opacity:.6; }
  label { color:var(--suave); font-size:14px; display:flex; gap:8px; align-items:center; }
  #erro { color:#b3261e; font-size:14px; min-height:1.2em; margin:0; }
</style>

const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const CHAVE_LOCAL = "fichario-escritorio-" + D.sal;
async function abrir(k) {
  const claro = await crypto.subtle.decrypt({ name:"AES-GCM", iv:u8(D.iv) }, k, u8(D.c));
  document.open(); document.write(new TextDecoder().decode(claro)); document.close();
}
async function derivar(senha) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt:u8(D.sal), iterations:D.it, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, true, ["decrypt"]);
}
(async () => {
  const salva = localStorage.getItem(CHAVE_LOCAL);
  if (!salva) return;
  // Espera a página terminar de carregar; antes disso o document.open() é ignorado.
  if (document.readyState !== "complete") await new Promise(r => addEventListener("load", r, { once: true }));
  try { await abrir(await crypto.subtle.importKey("raw", u8(salva), "AES-GCM", true, ["decrypt"])); }
  catch { localStorage.removeItem(CHAVE_LOCAL); }
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("btn"), erro = document.getElementById("erro");
  btn.disabled = true; btn.textContent = "Abrindo…"; erro.textContent = "";
  const lembrar = document.getElementById("lembrar").checked;
  try {
    const k = await derivar(document.getElementById("senha").value);
    // Testa a senha antes de guardar; só guarda a chave se abriu.
    await crypto.subtle.decrypt({ name:"AES-GCM", iv:u8(D.iv) }, k, u8(D.c));
    if (lembrar) {
      const bruta = new Uint8Array(await crypto.subtle.exportKey("raw", k));
      localStorage.setItem(CHAVE_LOCAL, btoa(String.fromCharCode(...bruta)));
    }
    await abrir(k);
  } catch {
    erro.textContent = "Senha incorreta."; btn.disabled = false; btn.textContent = "Entrar";
  }
});
</script>
